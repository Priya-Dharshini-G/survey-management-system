<div class="flex flex-items-center flex-content-center height-100">
  <div class="flex flex-column gap-15 box-shadow rounded-20 p-20 width-40">
    <h3 class="no-margin">Forgot Password</h3>

    <form class="flex flex-column gap-10">
      <div class="flex flex-column gap-5">
        <p class="font-14">Email (Use the login email)</p>
        <input
          id="email"
          class="input-box"
          [class.input-box-highlight]="!email.hasError('required')"
          [class.invalid-input-box]="
            (email.hasError('required') || email.hasError('pattern')) && email.touched
          "
          [formControl]="email"
          placeholder="Enter the email"
        />
        @if (email.hasError('required') && email.touched) {
          <div class="error-msg">This field is required</div>
        }
        @if (!email.hasError('required') && email.hasError('pattern') && email.touched) {
          <div class="error-msg">Invalid Email</div>
        }
      </div>
    </form>
    <div class="flex flex-items-center flex-content-end gap-10">
      <button class="button" routerLink="/login" [disabled]="isLoading">Cancel</button>
      <button
        class="button primary-bg text-white"
        [class.loading-button]="isLoading"
        [disabled]="isLoading"
        (click)="sendForgotPasswordMail()"
      >
        Submit
        @if (isLoading) {
          <app-loader class="absolute"></app-loader>
        }
      </button>
    </div>
  </div>
</div>
